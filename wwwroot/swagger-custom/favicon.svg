<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#09080c"/>
  <!-- Tarnished gold crown -->
  <rect x="4" y="1" width="1" height="2" fill="#d4a84f"/>
  <rect x="7" y="1" width="2" height="2" fill="#d4a84f"/>
  <rect x="11" y="1" width="1" height="2" fill="#d4a84f"/>
  <rect x="4" y="3" width="8" height="1" fill="#b3842d"/>
  <!-- Skull cranium -->
  <rect x="4" y="4" width="8" height="1" fill="#ece3d5"/>
  <rect x="3" y="5" width="10" height="4" fill="#ece3d5"/>
  <rect x="4" y="9" width="8" height="2" fill="#d6cbb8"/>
  <rect x="5" y="11" width="6" height="2" fill="#b2a8b8"/>
  <!-- Glowing crimson eyes -->
  <rect x="5" y="6" width="2" height="2" fill="#d92638"/>
  <rect x="9" y="6" width="2" height="2" fill="#d92638"/>
  <rect x="5" y="6" width="1" height="1" fill="#f28c28"/>
  <rect x="9" y="6" width="1" height="1" fill="#f28c28"/>
  <!-- Nasal cavity & teeth -->
  <rect x="7" y="9" width="2" height="1" fill="#1a1622"/>
  <rect x="5" y="12" width="1" height="1" fill="#1a1622"/>
  <rect x="7" y="12" width="1" height="1" fill="#1a1622"/>
  <rect x="9" y="12" width="1" height="1" fill="#1a1622"/>
  <!-- Crimson seal border -->
  <rect x="0" y="0" width="16" height="1" fill="#7a1624"/>
  <rect x="0" y="15" width="16" height="1" fill="#7a1624"/>
  <rect x="0" y="0" width="1" height="16" fill="#7a1624"/>
  <rect x="15" y="0" width="1" height="16" fill="#7a1624"/>
</svg>
