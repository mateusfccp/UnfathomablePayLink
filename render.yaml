services:
  - type: web
    name: unfathomable-paylink
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Swagger__Enabled
        value: "true"
      - key: Seed__Enabled
        value: "true"
      - key: Seed__TestBusinessName
        value: Testing
      - key: Seed__TestBusinessDocument
        value: 00-00000000-0
      - key: Seed__TestBusinessApiKey
        value: testing
      - key: StreamHub__BaseUrl
        value: https://streamhub-api-lgkh.onrender.com
      - key: StreamHub__Email
        value: paylink@uap.edu.ar
      - key: StreamHub__Password
        value: pay link
      - key: StreamHub__DefaultFallbackAmount
        value: "0"
      - key: GobernanzaDigital__BaseUrl
        value: https://localhost:7233
      - key: ConnectionStrings__PayLinkDb
        value: Data Source=/app/data/PayLink.db
